name: CMake Build and Install

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os_name }} Build
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x64 & ARM64)
          - os: ubuntu-latest
            os_name: linux-x64
            triplet: x64-linux
            cmake_args: ""
          - os: ubuntu-24.04-arm
            os_name: linux-arm64
            triplet: arm64-linux
            cmake_args: ""

          # Windows (x64 & ARM64)
          - os: windows-latest
            os_name: windows-x64
            triplet: x64-windows
            cmake_args: "-A x64"
          - os: windows-11-arm
            os_name: windows-arm64
            triplet: arm64-windows
            cmake_args: "-A ARM64"

          # macOS (Intel x64 & Apple Silicon ARM64)
          - os: macos-15-intel
            os_name: macos-x64
            triplet: x64-osx
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          - os: macos-latest
            os_name: macos-arm64
            triplet: arm64-osx
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool ninja-build pkg-config curl zip unzip tar libwayland-dev libxkbcommon-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf autoconf-archive automake libtool ninja pkg-config

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "pandorica_graphics/vcpkg.json"

      - name: Configure CMake
        run: >
          cmake -S pandorica_graphics -B pandorica_graphics/build
          ${{ matrix.cmake_args }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Library
        run: cmake --build pandorica_graphics/build --config Release

      - name: Install to Local Directory
        run: |
          cmake --install pandorica_graphics/build --prefix ./dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PGEngine-${{ matrix.os_name }}
          path: ./dist

  publish:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files

      - name: Zip Artifacts
        run: |
          cd release-files
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
